<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Auditor: Sacred RSI Regime</title>
  <meta name="theme-color" content="#f8f9fa">
  
  <link rel="manifest" href='data:application/manifest+json,{"name":"RSI Auditor","short_name":"Auditor","display":"standalone","start_url":".","background_color":"#f8f9fa","theme_color":"#f8f9fa","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23e2e8f0%22/%3E%3Ctext y=%2250%22 x=%2250%22 font-size=%2260%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23000%22%3E%26%23128269%3B%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { margin: 0; padding: 0; background-color: #f8f9fa; color: #000000; }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useMemo } = React;

    // ─── INDICES ─────────────────────────────────────────────────────────────
    const ALL_INDICES = [
      { name:"Nifty 50", symbol:"^NSEI", exchange:"NSE", category:"Broad Market" },
      { name:"Nifty Next 50", symbol:"^NIFTYNXT50", exchange:"NSE", category:"Broad Market" },
      { name:"NIFTY 500", symbol:"^CNX500", exchange:"NSE", category:"Broad Market" },
      { name:"NIFTY Midcap 100", symbol:"^NSMIDCP100", exchange:"NSE", category:"Broad Market" },
      { name:"NIFTY Smallcap 100", symbol:"^CNXSC", exchange:"NSE", category:"Broad Market" },
      { name:"Nifty Bank", symbol:"^NSEBANK", exchange:"NSE", category:"Sector" },
      { name:"Nifty IT", symbol:"^CNXIT", exchange:"NSE", category:"Sector" },
      { name:"NIFTY Auto", symbol:"^CNXAUTO", exchange:"NSE", category:"Sector" },
      { name:"NIFTY Pharma", symbol:"^CNXPHARMA", exchange:"NSE", category:"Sector" },
      { name:"NIFTY FMCG", symbol:"^CNXFMCG", exchange:"NSE", category:"Sector" },
      { name:"NIFTY Metal", symbol:"^CNXMETAL", exchange:"NSE", category:"Sector" },
      { name:"NIFTY Realty", symbol:"^CNXREALTY", exchange:"NSE", category:"Sector" },
      { name:"NIFTY Energy", symbol:"^CNXENERGY", exchange:"NSE", category:"Sector" },
      { name:"Sensex", symbol:"^BSESN", exchange:"BSE", category:"Broad Market" },
      { name:"BSE MidCap", symbol:"BSE-MID150.BO", exchange:"BSE", category:"Broad Market" },
      { name:"BSE SmallCap", symbol:null, exchange:"BSE", category:"Broad Market" },
      { name:"Nifty 50 Equal Weight", symbol:"^NIFTY50EW", exchange:"NSE", category:"Strategy" },
      { name:"Nifty100 Qualty30", symbol:"^NIFTY100QU30", exchange:"NSE", category:"Strategy" },
      { name:"India VIX", symbol:"^INDIAVIX", exchange:"NSE", category:"Volatility" }
    ];

    // ─── MATH & TECHNICALS ───────────────────────────────────────────────────
    const PROXY = "https://corsproxy.io/?";
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // TradingView smoothed RSI (Wilder's RMA) returning full history array
    function calcRSIHistory(closes, period) {
      let rsis = [];
      const v = closes.filter(x => x != null && !isNaN(x));
      if (v.length < period + 1) return rsis;
      
      let gains = 0, losses = 0;
      for (let i = 1; i <= period; i++) {
        const d = v[i] - v[i - 1];
        if (d > 0) gains += d; else losses -= d;
      }
      let ag = gains / period, al = losses / period;
      rsis.push(al === 0 ? 100 : parseFloat((100 - 100 / (1 + ag / al)).toFixed(2)));

      for (let i = period + 1; i < v.length; i++) {
        const d = v[i] - v[i - 1];
        ag = (ag * (period - 1) + Math.max(d, 0)) / period;
        al = (al * (period - 1) + Math.abs(Math.min(d, 0))) / period;
        rsis.push(al === 0 ? 100 : parseFloat((100 - 100 / (1 + ag / al)).toFixed(2)));
      }
      return rsis;
    }

    // Weighted Moving Average (WMA)
    function calcWMA(data, period) {
      if (!data || data.length < period) return null;
      let sum = 0;
      let weightSum = (period * (period + 1)) / 2;
      let slice = data.slice(-period);
      for (let i = 0; i < period; i++) {
        sum += slice[i] * (i + 1);
      }
      return parseFloat((sum / weightSum).toFixed(2));
    }

    async function fetchIndex(symbol) {
      // Fetch both weekly (2yr) and daily (6mo)
      const wkUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1wk&range=2y`;
      const dUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=6mo`;
      const qtUrl = `https://query1.finance.yahoo.com/v8/finance/quote?symbols=${symbol}`;
      
      try {
        const [wkRes, dRes, qtRes] = await Promise.all([
          fetch(PROXY + encodeURIComponent(wkUrl), { signal: AbortSignal.timeout(15000) }),
          fetch(PROXY + encodeURIComponent(dUrl), { signal: AbortSignal.timeout(15000) }),
          fetch(PROXY + encodeURIComponent(qtUrl), { signal: AbortSignal.timeout(15000) }),
        ]);
        
        const wkData = wkRes.ok ? await wkRes.json() : null;
        const dData = dRes.ok ? await dRes.json() : null;
        const qtData = qtRes.ok ? await qtRes.json() : null;

        const wCloses = wkData?.chart?.result?.[0]?.indicators?.quote?.[0]?.close || [];
        const dCloses = dData?.chart?.result?.[0]?.indicators?.quote?.[0]?.close || [];
        const q = qtData?.quoteResponse?.result?.[0] || null;

        const price = q?.regularMarketPrice ?? (wCloses.length ? wCloses[wCloses.length-1] : null);

        // Weekly Calcs
        const wRsiArray = calcRSIHistory(wCloses, 14);
        const wRsi = wRsiArray.length ? wRsiArray[wRsiArray.length - 1] : null;
        const wRsi4WeeksAgo = wRsiArray.length >= 5 ? wRsiArray[wRsiArray.length - 5] : null;
        const wma20Price = calcWMA(wCloses, 20);
        const wma20Rsi = calcWMA(wRsiArray, 20);

        // Daily Calcs
        const dRsiArray = calcRSIHistory(dCloses, 14);
        const dRsi = dRsiArray.length ? dRsiArray[dRsiArray.length - 1] : null;
        const dRsi14DaysAgo = dRsiArray.length >= 15 ? dRsiArray[dRsiArray.length - 15] : null;
        const dPrice14DaysAgo = dCloses.length >= 15 ? dCloses[dCloses.length - 15] : null;

        // Regimes
        let regime = "C";
        if (wRsi >= 50 && wma20Price && price > wma20Price) regime = "A";
        else if (wRsi >= 40 && wRsi < 50) regime = "B";

        // Action Logic
        let action = "HOLD";
        let rec = "Monitor";
        if (regime === "A" && dRsi >= 40 && dRsi <= 50) { action = "BUY"; rec = "💎 STRIKE (Optimal Entry)"; }
        else if (regime === "A" && dRsi > 70) { action = "HOLD"; rec = "OVERHEATED (Wait for daily dip)"; }
        else if (regime === "B") { action = "REDUCE"; rec = "🔴 TRAP (Fatigue. Do not buy dips)"; }
        else if (regime === "C") { action = "SELL"; rec = "💀 AVOID (Trust Break. Never avg down)"; }

        // Vector
        let rsiRoc = null;
        let vector = "Unknown";
        if (wRsi && wRsi4WeeksAgo) {
          rsiRoc = parseFloat((wRsi - wRsi4WeeksAgo).toFixed(2));
          if (rsiRoc > 0 && wRsi >= 50) vector = "Rising";
          else if (rsiRoc < 0 && wRsi >= 50) vector = "Phase 1: Healthy Cooldown";
          else if (rsiRoc < 0 && wRsi >= 40) vector = "Phase 2: Structural Warning";
          else if (wRsi < 40) vector = "Phase 3: Regime Death";
        }

        // Divergence Check (Cosmetic Growth)
        let divAlert = "";
        if (price && dPrice14DaysAgo && dRsi && dRsi14DaysAgo) {
          if (price > dPrice14DaysAgo && dRsi < dRsi14DaysAgo && wRsi < 60) {
            divAlert = "⚠️ Cosmetic Growth (Price high, RSI lower high)";
          }
        }
        
        // Psych Alert
        let psych = "";
        if (regime === "B") psych = "Lookout: Don't get trapped by EPS optics if failing to reclaim WK 50.";
        if (regime === "A") psych = "Price moves first; earnings explanations come later.";

        return {
          price, wRsi, dRsi, wma20Price, wma20Rsi,
          regime, action, rec, rsiRoc, vector, divAlert, psych
        };
      } catch { return { error: true }; }
    }

    // ─── COMPONENTS ──────────────────────────────────────────────────────────
    function Pill({ v, logic }) {
      let bg = "#ffffff";
      if (logic === "A") bg = "#86efac";
      if (logic === "B") bg = "#fde047";
      if (logic === "C") bg = "#fca5a5";
      if (logic === "BUY") bg = "#86efac";
      if (logic === "SELL") bg = "#fca5a5";
      if (logic === "REDUCE") bg = "#fde047";

      return (
        <span style={{
          display:"inline-block", textAlign:"center", minWidth: 30,
          padding:"4px 8px", borderRadius:4, fontWeight:700,
          fontSize:12, fontFamily:"'DM Mono',monospace",
          background: bg, color: "#000000", border: "2px solid #000000"
        }}>{v}</span>
      );
    }

    const AuditorDashboard = () => {
      const [scanning, setScanning] = useState(false);
      const [scanned, setScanned] = useState(false);
      const [progress, setProgress] = useState({ done:0, total:0, label:"" });
      const [results, setResults] = useState({});
      const stopRef = useRef(false);

      const handleScan = async () => {
        stopRef.current = false;
        setScanning(true);
        setResults({});
        setScanned(false);
        const toFetch = ALL_INDICES.filter(i => i.symbol);
        const total = toFetch.length;
        let done = 0;

        for (const idx of toFetch) {
          if (stopRef.current) break;
          setProgress({ done, total, label: `Auditing ${idx.name}` });
          const data = await fetchIndex(idx.symbol);
          done++;
          setResults(prev => ({ ...prev, [idx.symbol]: data }));
          setProgress({ done, total, label: `Audited ${idx.name}` });
          await sleep(500); // Higher sleep for 3 requests per index
        }
        setProgress({ done: total, total, label: "✓ Audit Complete" });
        setScanned(true);
        setScanning(false);
      };

      const rows = ALL_INDICES.filter(i => i.symbol).map(idx => ({ ...idx, ...(results[idx.symbol] || {}) }));

      return (
        <div style={{minHeight:"100vh",background:"#f8f9fa",fontFamily:"'DM Sans','Segoe UI',sans-serif",color:"#000000",padding:"20px 16px"}}>
          <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=DM+Mono:wght@500;700&display=swap" rel="stylesheet"/>
          <div style={{maxWidth:1400,margin:"0 auto"}}>

            {/* Header */}
            <div style={{marginBottom:20}}>
              <h1 style={{margin:"0 0 8px 0",fontSize:26,fontWeight:700,letterSpacing:-0.5}}>
                Nifty Portfolio & Psychology Auditor
              </h1>
              <div style={{fontSize:13,fontWeight:700,fontFamily:"'DM Mono',monospace",background:"#e2e8f0",padding:"8px 12px",border:"2px solid #000",display:"inline-block"}}>
                Sacred Rule: True compounders do NOT stay below 40 RSI.
              </div>
            </div>

            {/* Controls */}
            <div style={{background:"#ffffff",border:"2px solid #000000",padding:"16px",marginBottom:20,boxShadow:"4px 4px 0px #000000", display:"flex", justifyContent:"space-between", alignItems:"center"}}>
              <div style={{fontSize:12,fontWeight:700,maxWidth:600}}>
                <strong>Regime A:</strong> Structural Bull (WK RSI ≥ 50 + P > 20WMA). Orderly pullbacks to Daily RSI 40-50 are entries.<br/>
                <strong>Regime B:</strong> Fatigue (WK RSI 40-49). Retail trap lookout.<br/>
                <strong>Regime C:</strong> Trust Break (WK RSI &lt; 40). Institutional exit.
              </div>
              <div>
                {!scanning ? (
                  <button onClick={handleScan} style={{
                    background:"#000000",color:"#ffffff",fontWeight:700,padding:"10px 24px",
                    border:"2px solid #000000",cursor:"pointer",fontSize:14,fontFamily:"'DM Mono',monospace",
                  }}>EXECUTE X-RAY AUDIT</button>
                ) : (
                  <button onClick={()=>{stopRef.current=true;}} style={{
                    background:"#ffffff",color:"#000000",fontWeight:700,padding:"10px 24px",
                    border:"2px solid #000000",cursor:"pointer",fontSize:14,fontFamily:"'DM Mono',monospace",
                  }}>STOP SCAN ({Math.round((progress.done/progress.total)*100)}%)</button>
                )}
              </div>
            </div>

            {/* Main Table */}
            {rows.length > 0 && Object.keys(results).length > 0 && (
              <div style={{overflowX:"auto", background:"#ffffff", border:"2px solid #000000"}}>
                <table style={{width:"100%",borderCollapse:"collapse", textAlign:"left", fontSize:12, fontWeight:700}}>
                  <thead>
                    <tr style={{background:"#e2e8f0", borderBottom:"2px solid #000000"}}>
                      <th style={{padding:"10px", borderRight:"1px solid #000"}}>Scheme/Index Name</th>
                      <th style={{padding:"10px", borderRight:"1px solid #000"}}>NAV / Price</th>
                      <th style={{padding:"10px", borderRight:"1px solid #000"}}>Daily RSI (14)</th>
                      <th style={{padding:"10px", borderRight:"1px solid #000"}}>Weekly RSI</th>
                      <th style={{padding:"10px", borderRight:"1px solid #000"}}>WMA20 of RSI</th>
                      <th style={{padding:"10px", borderRight:"1px solid #000"}}>Price > 20WMA</th>
                      <th style={{padding:"10px", borderRight:"1px solid #000", textAlign:"center"}}>Regime</th>
                      <th style={{padding:"10px", borderRight:"1px solid #000", textAlign:"center"}}>Action</th>
                      <th style={{padding:"10px", borderRight:"1px solid #000"}}>Recommendations</th>
                      <th style={{padding:"10px"}}>Vector & Divergence Alerts</th>
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map((r, i) => {
                      if (!r.wRsi) return null;
                      const isAboveWma = r.price && r.wma20Price && r.price > r.wma20Price;
                      return (
                        <tr key={i} style={{borderBottom:"1px solid #000", background: i%2===0?"#ffffff":"#f8f9fa"}}>
                          <td style={{padding:"10px", borderRight:"1px solid #000", fontFamily:"'DM Mono',monospace"}}>{r.name}</td>
                          <td style={{padding:"10px", borderRight:"1px solid #000", fontFamily:"'DM Mono',monospace"}}>{r.price?.toFixed(2) || "—"}</td>
                          <td style={{padding:"10px", borderRight:"1px solid #000", fontFamily:"'DM Mono',monospace", background: r.dRsi>=40&&r.dRsi<=50&&r.regime==="A"?"#86efac":""}}>{r.dRsi || "—"}</td>
                          <td style={{padding:"10px", borderRight:"1px solid #000", fontFamily:"'DM Mono',monospace"}}>{r.wRsi || "—"}</td>
                          <td style={{padding:"10px", borderRight:"1px solid #000", fontFamily:"'DM Mono',monospace"}}>{r.wma20Rsi || "—"}</td>
                          <td style={{padding:"10px", borderRight:"1px solid #000", fontFamily:"'DM Mono',monospace", textAlign:"center"}}>
                            {isAboveWma ? "YES" : "NO"}
                          </td>
                          <td style={{padding:"10px", borderRight:"1px solid #000", textAlign:"center"}}>
                            <Pill v={r.regime} logic={r.regime} />
                          </td>
                          <td style={{padding:"10px", borderRight:"1px solid #000", textAlign:"center"}}>
                            <Pill v={r.action} logic={r.action} />
                          </td>
                          <td style={{padding:"10px", borderRight:"1px solid #000"}}>{r.rec}</td>
                          <td style={{padding:"10px", fontSize:11}}>
                            <div style={{marginBottom:4}}><strong>Vector:</strong> {r.vector} (Δ {r.rsiRoc})</div>
                            {r.divAlert && <div style={{color:"#000", background:"#fca5a5", padding:"2px 4px", border:"1px solid #000", display:"inline-block", marginBottom:4}}>{r.divAlert}</div>}
                            <div style={{fontStyle:"italic"}}>{r.psych}</div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
            
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AuditorDashboard />);
  </script>
</body>
</html>
