    // TradingView smoothed RSI (Wilder's RMA) returning full history array
    function calcRSIHistory(closes, period) {
      let rsis = [];
      const v = closes.filter(x => x != null && !isNaN(x));
      if (v.length < period + 1) return rsis;
      
      let gains = 0, losses = 0;
      for (let i = 1; i <= period; i++) {
        const d = v[i] - v[i - 1];
        if (d > 0) gains += d; else losses -= d;
      }
      let ag = gains / period, al = losses / period;
      rsis.push(al === 0 ? 100 : parseFloat((100 - 100 / (1 + ag / al)).toFixed(2)));

      for (let i = period + 1; i < v.length; i++) {
        const d = v[i] - v[i - 1];
        ag = (ag * (period - 1) + Math.max(d, 0)) / period;
        al = (al * (period - 1) + Math.abs(Math.min(d, 0))) / period;
        rsis.push(al === 0 ? 100 : parseFloat((100 - 100 / (1 + ag / al)).toFixed(2)));
      }
      return rsis;
    }

    // Weighted Moving Average (WMA)
    function calcWMA(data, period) {
      if (!data || data.length < period) return null;
      let sum = 0;
      let weightSum = (period * (period + 1)) / 2;
      let slice = data.slice(-period);
      for (let i = 0; i < period; i++) {
        sum += slice[i] * (i + 1);
      }
      return parseFloat((sum / weightSum).toFixed(2));
    }

    async function fetchIndex(symbol) {
      const wkUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1wk&range=2y`;
      const dUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=6mo`;
      const qtUrl = `https://query1.finance.yahoo.com/v8/finance/quote?symbols=${symbol}`;
      
      try {
        const [wkRes, dRes, qtRes] = await Promise.all([
          fetch(PROXY + encodeURIComponent(wkUrl), { signal: AbortSignal.timeout(15000) }),
          fetch(PROXY + encodeURIComponent(dUrl), { signal: AbortSignal.timeout(15000) }),
          fetch(PROXY + encodeURIComponent(qtUrl), { signal: AbortSignal.timeout(15000) }),
        ]);
        
        const wkData = wkRes.ok ? await wkRes.json() : null;
        const dData = dRes.ok ? await dRes.json() : null;
        const qtData = qtRes.ok ? await qtRes.json() : null;

        const wCloses = wkData?.chart?.result?.[0]?.indicators?.quote?.[0]?.close || [];
        const dCloses = dData?.chart?.result?.[0]?.indicators?.quote?.[0]?.close || [];
        const q = qtData?.quoteResponse?.result?.[0] || null;

        const price = q?.regularMarketPrice ?? (wCloses.length ? wCloses[wCloses.length-1] : null);

        // Weekly Calcs - 4W, 8W, 14W
        const wRsiArray4 = calcRSIHistory(wCloses, 4);
        const wRsiArray8 = calcRSIHistory(wCloses, 8);
        const wRsiArray14 = calcRSIHistory(wCloses, 14);

        const wRsi4 = wRsiArray4.length ? wRsiArray4[wRsiArray4.length - 1] : null;
        const wRsi8 = wRsiArray8.length ? wRsiArray8[wRsiArray8.length - 1] : null;
        const wRsi14 = wRsiArray14.length ? wRsiArray14[wRsiArray14.length - 1] : null;

        // Default Weekly RSI is now 4-Period for core logic
        const wRsi = wRsi4;
        
        const wma20Price = calcWMA(wCloses, 20);
        const wma20Rsi = calcWMA(wRsiArray4, 20);

        // Daily Calcs
        const dRsiArray = calcRSIHistory(dCloses, 14);
        const dRsi = dRsiArray.length ? dRsiArray[dRsiArray.length - 1] : null;

        // Regimes (Based on 4-Week RSI)
        let regime = "C";
        if (wRsi >= 50 && wma20Price && price > wma20Price) regime = "A";
        else if (wRsi >= 40 && wRsi < 50) regime = "B";

        // Action Logic
        let action = "HOLD";
        let rec = "Monitor";
        if (regime === "A" && dRsi >= 40 && dRsi <= 50) { action = "BUY"; rec = "💎 STRIKE (Optimal Entry)"; }
        else if (regime === "A" && dRsi > 70) { action = "HOLD"; rec = "OVERHEATED (Wait for daily dip)"; }
        else if (regime === "B") { action = "REDUCE"; rec = "🔴 TRAP (Fatigue. Do not buy dips)"; }
        else if (regime === "C") { action = "SELL"; rec = "💀 AVOID (Trust Break. Never avg down)"; }

        return { price, wRsi, wRsi4, wRsi8, wRsi14, dRsi, wma20Price, wma20Rsi, regime, action, rec };
      } catch { return { error: true }; }
    }

    // ─── COMPONENTS ──────────────────────────────────────────────────────────
    function Pill({ v, logic }) {
      let bg = "#e2e8f0";
      if (logic === "A") bg = "#86efac";
      if (logic === "B") bg = "#fde047";
      if (logic === "C") bg = "#fca5a5";
      if (logic === "BUY") bg = "#86efac";
      if (logic === "SELL") bg = "#fca5a5";
      if (logic === "REDUCE") bg = "#fde047";

      return (
        <span style={{
          display: "inline-block", textAlign: "center", minWidth: 40,
          padding: "4px 8px", borderRadius: 4, fontWeight: 400,
          fontSize: 12, fontFamily: "'DM Mono', monospace",
          background: bg, color: "#000000", border: "1px solid #000000"
        }}>{v}</span>
      );
    }

    const AuditorDashboard = () => {
      const [scanning, setScanning] = useState(false);
      const [scanned, setScanned] = useState(false);
      const [progress, setProgress] = useState({ done: 0, total: 0, label: "" });
      const [results, setResults] = useState({});
      const [autoRefresh, setAutoRefresh] = useState(false);
      const [regimeFilter, setRegimeFilter] = useState("ALL");
      const stopRef = useRef(false);

      const handleScan = async () => {
        stopRef.current = false;
        setScanning(true);
        const toFetch = ALL_INDICES.filter(i => i.symbol);
        const total = toFetch.length;
        let done = 0;

        let tempResults = { ...results };

        for (const idx of toFetch) {
          if (stopRef.current) break;
          setProgress({ done, total, label: `Auditing ${idx.name}` });
          const data = await fetchIndex(idx.symbol);
          done++;
          tempResults[idx.symbol] = data;
          setResults({ ...tempResults });
          setProgress({ done, total, label: `Audited ${idx.name}` });
          await sleep(500); 
        }
        setProgress({ done: total, total, label: "✓ Audit Complete" });
        setScanned(true);
        setScanning(false);
      };

      // 10 Second Safety Auto-Refresh Loop
      useEffect(() => {
        let intervalId;
        if (autoRefresh && scanned && !scanning) {
          intervalId = setInterval(() => {
            handleScan();
          }, 10000); 
        }
        return () => {
          if (intervalId) clearInterval(intervalId);
        };
      }, [autoRefresh, scanned, scanning]);

      // Filtering and Sorting Data
      const sortedRows = useMemo(() => {
        let list = ALL_INDICES.filter(i => i.symbol).map(idx => ({ ...idx, ...(results[idx.symbol] || {}) }));
        
        // Filter by Regime
        if (regimeFilter !== "ALL") {
          list = list.filter(r => r.regime === regimeFilter);
        }

        // Sort: Regime A -> B -> C, then Weekly RSI Descending
        return list.sort((a, b) => {
          const regimeOrder = { "A": 1, "B": 2, "C": 3, "Unknown": 4 };
          const regA = regimeOrder[a.regime] || 4;
          const regB = regimeOrder[b.regime] || 4;
          
          if (regA !== regB) return regA - regB;
          
          // If same regime, sort by wRsi descending
          const rsiA = a.wRsi ?? -Infinity;
          const rsiB = b.wRsi ?? -Infinity;
          return rsiB - rsiA;
        });
      }, [results, regimeFilter]);

      // Color logic helper for RSI
      const getRsiColor = (val) => {
        if (val == null) return "transparent";
        if (val >= 50) return "#86efac"; // Green
        if (val >= 40 && val < 50) return "#fdba74"; // Orange
        return "#fca5a5"; // Red
      };

      return (
        <div style={{ minHeight: "100vh", background: "#f8f9fa", fontFamily: "'DM Sans', 'Segoe UI', sans-serif", color: "#000000", padding: "20px 16px" }}>
          <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
          <div style={{ maxWidth: 1400, margin: "0 auto" }}>

            {/* Header */}
            <div style={{ marginBottom: 20 }}>
              <h1 style={{ margin: "0 0 8px 0", fontSize: 26, fontWeight: 400, letterSpacing: -0.5, color: "#000000" }}>
                Lie Detector Scanner
              </h1>
              <div style={{ fontSize: 13, fontWeight: 400, fontFamily: "'DM Mono', monospace", background: "#f4a261", color: "#000000", padding: "8px 12px", border: "1px solid #000000", display: "inline-block" }}>
                Sacred Rule: True compounders do NOT stay below 40 RSI. (Base = 4W RSI)
              </div>
            </div>

            {/* Controls */}
            <div style={{ background: "#ffffff", border: "1px solid #000000", padding: "16px", marginBottom: 20, boxShadow: "4px 4px 0px #000000", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "16px" }}>
              <div style={{ fontSize: 12, fontWeight: 400, maxWidth: 600, color: "#000000" }}>
                Regime A: Structural Bull (4W RSI ≥ 50 + P {'>'} 20WMA). Orderly pullbacks to Daily RSI 40-50 are entries.<br />
                Regime B: Fatigue (4W RSI 40-49). Retail trap lookout.<br />
                Regime C: Trust Break (4W RSI {'<'} 40). Institutional exit.
              </div>
              <div style={{ display: "flex", gap: "12px", alignItems: "center", flexWrap: "wrap" }}>
                
                {/* Regime Filter Dropdown */}
                <div style={{ display: "flex", alignItems: "center", gap: "6px" }}>
                  <label style={{ fontSize: 13, fontWeight: 400, color: "#000000", fontFamily: "'DM Mono', monospace" }}>REGIME FILTER:</label>
                  <select 
                    value={regimeFilter} 
                    onChange={e => setRegimeFilter(e.target.value)}
                    style={{ background: "#ffffff", color: "#000000", border: "1px solid #000000", fontWeight: 400, padding: "6px 10px", fontFamily: "'DM Mono', monospace", cursor: "pointer" }}
                  >
                    <option value="ALL">ALL</option>
                    <option value="A">Regime A</option>
                    <option value="B">Regime B</option>
                    <option value="C">Regime C</option>
                  </select>
                </div>

                <label style={{ display: "flex", alignItems: "center", gap: "6px", fontSize: 13, fontWeight: 400, cursor: "pointer", color: "#000000", fontFamily: "'DM Mono', monospace" }}>
                  <input 
                    type="checkbox" 
                    checked={autoRefresh} 
                    onChange={(e) => setAutoRefresh(e.target.checked)} 
                    style={{ accentColor: "#000000", width: 16, height: 16 }} 
                  />
                  AUTO-AUDIT (10s)
                </label>

                {!scanning ? (
                  <button onClick={handleScan} style={{
                    background: "#000000", color: "#ffffff", fontWeight: 400, padding: "8px 20px",
                    border: "1px solid #000000", cursor: "pointer", fontSize: 13, fontFamily: "'DM Mono', monospace",
                  }}>EXECUTE X-RAY AUDIT</button>
                ) : (
                  <button onClick={() => { stopRef.current = true; }} style={{
                    background: "#ffffff", color: "#000000", fontWeight: 400, padding: "8px 20px",
                    border: "1px solid #000000", cursor: "pointer", fontSize: 13, fontFamily: "'DM Mono', monospace",
                  }}>STOP SCAN ({progress.total > 0 ? Math.round((progress.done / progress.total) * 100) : 0}%)</button>
                )}
              </div>
            </div>

            {/* Main Table */}
            {sortedRows.length > 0 && Object.keys(results).length > 0 && (
              <div style={{ overflowX: "auto", background: "#ffffff", border: "1px solid #000000" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", textAlign: "left", fontSize: 12, fontWeight: 400, color: "#000000" }}>
                  <thead>
                    <tr style={{ background: "#e2e8f0", borderBottom: "1px solid #000000", color: "#000000" }}>
                      <th style={{ padding: "10px", borderRight: "1px solid #000000", fontWeight: 400 }}>Scheme/Index Name</th>
                      <th style={{ padding: "10px", borderRight: "1px solid #000000", fontWeight: 400 }}>NAV / Price</th>
                      <th style={{ padding: "10px", borderRight: "1px solid #000000", fontWeight: 400 }}>Daily RSI (14)</th>
                      <th style={{ padding: "10px", borderRight: "1px solid #000000", fontWeight: 400 }}>Weekly RSI (4W)</th>
                      <th style={{ padding: "10px", borderRight: "1px solid #000000", textAlign: "center", fontWeight: 400 }}>Confluence (4W|8W|14W)</th>
                      <th style={{ padding: "10px", borderRight: "1px solid #000000", fontWeight: 400 }}>WMA20 of RSI</th>
                      <th style={{ padding: "10px", borderRight: "1px solid #000000", textAlign: "center", fontWeight: 400 }}>Price {'>'} 20WMA</th>
                      <th style={{ padding: "10px", borderRight: "1px solid #000000", textAlign: "center", fontWeight: 400 }}>Regime</th>
                      <th style={{ padding: "10px", borderRight: "1px solid #000000", textAlign: "center", fontWeight: 400 }}>Action</th>
                      <th style={{ padding: "10px", fontWeight: 400 }}>Recommendations</th>
                    </tr>
                  </thead>
                  <tbody>
                    {sortedRows.map((r, i) => {
                      if (!r.wRsi) return null;
                      
                      const wRsiBg = getRsiColor(r.wRsi);

                      // Background color logic for Price > 20WMA
                      let wmaBg = "transparent";
                      let wmaText = "—";
                      if (r.price && r.wma20Price) {
                        if (r.price > r.wma20Price) {
                          wmaBg = "#86efac"; // Green
                          wmaText = "YES";
                        } else {
                          wmaBg = "#fca5a5"; // Red
                          wmaText = "NO";
                        }
                      }

                      return (
                        <tr key={i} style={{ borderBottom: "1px solid #000000", background: i % 2 === 0 ? "#ffffff" : "#f8f9fa", color: "#000000" }}>
                          <td style={{ padding: "10px", borderRight: "1px solid #000000", fontFamily: "'DM Mono', monospace" }}>{r.name}</td>
                          <td style={{ padding: "10px", borderRight: "1px solid #000000", fontFamily: "'DM Mono', monospace" }}>{r.price?.toFixed(2) || "—"}</td>
                          <td style={{ padding: "10px", borderRight: "1px solid #000000", fontFamily: "'DM Mono', monospace", background: r.dRsi >= 40 && r.dRsi <= 50 && r.regime === "A" ? "#86efac" : "transparent" }}>{r.dRsi || "—"}</td>
                          
                          <td style={{ padding: "10px", borderRight: "1px solid #000000", fontFamily: "'DM Mono', monospace", background: wRsiBg, borderBottom: "1px solid #000000", borderTop: "1px solid #000000", textAlign: "center" }}>{r.wRsi || "—"}</td>
                          
                          <td style={{ padding: "10px", borderRight: "1px solid #000000", textAlign: "center" }}>
                            <div style={{ display: "flex", gap: "6px", justifyContent: "center", alignItems: "center" }}>
                              <span style={{ background: getRsiColor(r.wRsi4), padding: "2px 6px", borderRadius: "3px", border: "1px solid #000000", minWidth: "32px", fontFamily: "'DM Mono', monospace", fontSize: "11px" }}>{r.wRsi4 || "—"}</span>
                              <span style={{ background: getRsiColor(r.wRsi8), padding: "2px 6px", borderRadius: "3px", border: "1px solid #000000", minWidth: "32px", fontFamily: "'DM Mono', monospace", fontSize: "11px" }}>{r.wRsi8 || "—"}</span>
                              <span style={{ background: getRsiColor(r.wRsi14), padding: "2px 6px", borderRadius: "3px", border: "1px solid #000000", minWidth: "32px", fontFamily: "'DM Mono', monospace", fontSize: "11px" }}>{r.wRsi14 || "—"}</span>
                            </div>
                          </td>

                          <td style={{ padding: "10px", borderRight: "1px solid #000000", fontFamily: "'DM Mono', monospace" }}>{r.wma20Rsi || "—"}</td>
                          <td style={{ padding: "10px", borderRight: "1px solid #000000", fontFamily: "'DM Mono', monospace", textAlign: "center", background: wmaBg }}>
                            {wmaText}
                          </td>
                          <td style={{ padding: "10px", borderRight: "1px solid #000000", textAlign: "center" }}>
                            <Pill v={r.regime} logic={r.regime} />
                          </td>
                          <td style={{ padding: "10px", borderRight: "1px solid #000000", textAlign: "center" }}>
                            <Pill v={r.action} logic={r.action} />
                          </td>
                          <td style={{ padding: "10px" }}>{r.rec}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AuditorDashboard />);
  </script>
</body>
</html>
