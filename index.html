};

function calcRSI(closes, period) {
  const v = closes.filter(x => x != null && !isNaN(x));
  if (v.length < period + 1) return [];
  const rsis = []; let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const d = v[i] - v[i - 1];
    if (d > 0) gains += d; else losses -= d;
  }
  let ag = gains / period, al = losses / period;
  rsis.push(al === 0 ? 100 : parseFloat((100 - 100 / (1 + ag / al)).toFixed(2)));
  for (let i = period + 1; i < v.length; i++) {
    const d = v[i] - v[i - 1];
    ag = (ag * (period - 1) + Math.max(d, 0)) / period;
    al = (al * (period - 1) + Math.abs(Math.min(d, 0))) / period;
    rsis.push(al === 0 ? 100 : parseFloat((100 - 100 / (1 + ag / al)).toFixed(2)));
  }
  return rsis;
}

function calcWMA(data, period) {
  if (!data || data.length < period) return null;
  const ws = (period * (period + 1)) / 2;
  const sl = data.slice(-period); let sum = 0;
  for (let i = 0; i < period; i++) sum += sl[i] * (i + 1);
  return parseFloat((sum / ws).toFixed(2));
}

function computeRegime(wRsi, price, wma20Price) {
  if (wRsi == null) return null;
  if (wRsi >= 50 && price && (!wma20Price || price > wma20Price)) return "A";
  if (wRsi >= 40 && wRsi < 50) return "B";
  return "C";
}

function genTradingDays(n) {
  const days = []; const d = new Date();
  while (days.length < n) {
    if (d.getDay() !== 0 && d.getDay() !== 6) days.push(new Date(d));
    d.setDate(d.getDate() - 1);
  }
  return days;
}

function fmtDDMMYYYY(d) {
  const pad = v => String(v).padStart(2, '0');
  return `${pad(d.getDate())}${pad(d.getMonth()+1)}${d.getFullYear()}`;
}

function computeAction(regime, dRsi) {
  if (regime === "A" && dRsi >= 40 && dRsi <= 50) return { action: "BUY", rec: "STRIKE — Optimal Entry" };
  if (regime === "A" && dRsi > 70) return { action: "HOLD", rec: "OVERHEATED — Wait for daily dip" };
  if (regime === "B") return { action: "REDUCE", rec: "TRAP — Fatigue" };
  return { action: "SELL", rec: "AVOID — Trust Break" };
}

function runExecutionTree(r, vixPrice, period) {
  if (!r || !r['wRsi'+period]) return null;
  if (!(r['wRsi'+period] >= 50 && (!r.wma20Price || r.price > r.wma20Price)))
    return { phase: 1, verdict: "ABORT", label: "ABORT", detail: r.wma20Price ? "W-RSI("+period+") < 50 or Price below 20WMA" : "W-RSI("+period+") < 50", color: "red" };
  if (!r.dRsi4 || !r.dRsi8 || !r.dRsi14)
    return { phase: 2, verdict: "NO DATA", label: "NO DATA", detail: "Daily RSI insufficient", color: "dim" };
  const inZ = v => v >= 40 && v <= 50;
  const ok = [inZ(r.dRsi4), inZ(r.dRsi8), inZ(r.dRsi14)];
  const cnt = ok.filter(Boolean).length;
  if (!ok.every(Boolean)) {
    if (cnt >= 1) return { phase: 3, verdict: "NEAR MISS", label: "NEAR MISS", detail: `D-RSI ${r.dRsi4}/${r.dRsi8}/${r.dRsi14} — ${cnt}/3 in zone`, color: "amber" };
    return { phase: 3, verdict: "NOT READY", label: "NOT READY", detail: `D-RSI ${r.dRsi4}/${r.dRsi8}/${r.dRsi14} not in zone`, color: "dim" };
  }
  const td = [];
  if (r['wRsi'+period] >= 50 && r['wRsi'+period] <= 52) td.push("TD1: W-RSI("+period+") barely holding (" + r['wRsi'+period] + ")");
  if (r.wma20Price && r.price < r.wma20Price) td.push("TD2: Price below 20WMA");
  if (r.divergence) td.push("TD3: RSI(4) rising below 20WMA");
  if (vixPrice && vixPrice > 20) td.push("TD4: VIX > 20 (" + vixPrice.toFixed(1) + ")");
  if (td.length) return { phase: 5, verdict: "FAKE SUPPORT", label: "FAKE SUPPORT", detail: td.join(" | "), color: "red" };
  return { phase: 5, verdict: "VERIFIED STRIKE", label: "VERIFIED STRIKE", detail: "All 3 D-RSI in zone. No trapdoors.", color: "green" };
}

// ── HA BAND (Confirmation 3) ──
function calcSMA(arr, period) {
  if (!arr || arr.length < period) return null;
  const sl = arr.slice(-period);
  return sl.reduce((a, b) => a + b, 0) / period;
}

function computeHACandles(closes) {
  if (!closes || closes.length < 3) return null;
  const haCloses = closes.map(c => c);
  const haOpens = [closes[0]];
  for (let i = 1; i < closes.length; i++) {
    haOpens.push((haOpens[i-1] + haCloses[i-1]) / 2);
  }
  return { haCloses, haOpens };
}

function computeHABandSignal(row, vixPrice) {
  const closes = row._dailyCloses;
  if (!closes || closes.length < 22) return null;
  const ha = computeHACandles(closes);
  if (!ha) return null;
  const { haCloses, haOpens } = ha;
  const n = haCloses.length;
  const haCurClose = haCloses[n - 1];
  const haCurOpen  = haOpens[n - 1];
  const haPrevClose = haCloses[n - 2];
  const haPrevOpen  = haOpens[n - 2];
  const haBull     = haCurClose >= haCurOpen;
  const haPrevBull = haPrevClose >= haPrevOpen;
  const sma8 = calcSMA(haCloses, 8);
  const sma21 = calcSMA(haCloses, 21);
  if (sma8 == null || sma21 == null) return null;
  const bandWidth = sma8 * 0.005;
  const smaHigh = sma8 + bandWidth;
  const smaLow  = sma8 - bandWidth;
  const aboveBand  = haCurClose > smaHigh;
  const insideBand = haCurClose >= smaLow && haCurClose <= smaHigh;
  const belowBand  = haCurClose < smaLow && haCurClose > sma21;
  const belowAnchor = haCurClose < sma21;
  let zone, zoneClass;
  if (aboveBand)   { zone = "BULL";      zoneClass = "green"; }
  else if (insideBand)  { zone = "CAUTION";  zoneClass = "amber"; }
  else if (belowBand)   { zone = "BEAR";     zoneClass = "red"; }
  else                  { zone = "BREAKDOWN";zoneClass = "red"; }
  let signal = null;
  let signalClass = "neutral";
  const reasons = [];
  const buyTrendEntry  = haBull && aboveBand && !haPrevBull;
  const buyDeep        = haBull && haCurClose > smaLow && haPrevClose <= sma21 * 1.005;
  const sellWeak       = !haBull && insideBand && haPrevBull;
  const sellBreakdown  = !haBull && haCurClose < smaLow;
  const sellAnchor     = !haBull && belowAnchor;
  if (sellAnchor) {
    signal = "STRONG SELL"; signalClass = "sell";
    reasons.push("HA red · Below 21 SMA anchor");
    reasons.push(`Price ${row.price?.toFixed(0)} | Anchor ${sma21.toFixed(0)}`);
  } else if (sellBreakdown) {
    signal = "SELL"; signalClass = "sell";
    reasons.push("HA red · Below 8 SMA Band → Bear");
    reasons.push(`SMA8 floor: ${smaLow.toFixed(0)}`);
    if (row.dRsi4 && row.dRsi4 < 40) reasons.push("D-RSI(4) weak: " + row.dRsi4?.toFixed(1));
  } else if (sellWeak) {
    signal = "CAUTION"; signalClass = "watch";
    reasons.push("HA turned red inside band → Momentum fading");
  } else if (buyDeep) {
    signal = "BUY"; signalClass = "buy";
    reasons.push("HA green · Deep pullback to 21 SMA → High R:R");
    reasons.push(`Anchor: ${sma21.toFixed(0)} | D-RSI: ${row.dRsi4?.toFixed(1)??'–'}/${row.dRsi8?.toFixed(1)??'–'}`);
  } else if (buyTrendEntry) {
    signal = "BUY"; signalClass = "buy";
    reasons.push("HA turned green · Above 8 SMA band → Trend resumption");
    if (row.dRsi4 >= 40 && row.dRsi4 <= 50) reasons.push("D-RSI(4) in strike zone: " + row.dRsi4?.toFixed(1));
    if (row.regime === 'A') reasons.push("Regime A confirmed");
  } else if (haBull && aboveBand) {
    signal = "HOLD"; signalClass = "buy";
    reasons.push("HA green · Above 8 SMA band → Trend intact");
    if (row.dRsi4 > 70) reasons.push("⚠ D-RSI(4) overheated (" + row.dRsi4?.toFixed(1) + ")");
  } else if (!haBull && insideBand) {
    signal = "WATCH"; signalClass = "watch";
    reasons.push("HA red inside band → Indecision zone");
    reasons.push(`Band: ${smaLow.toFixed(0)}–${smaHigh.toFixed(0)}`);
  } else {
    if (aboveBand && haBull) { signal = "HOLD"; signalClass = "buy"; reasons.push("Above band, green HA — trend intact"); }
    else if (belowAnchor) { signal = "AVOID"; signalClass = "sell"; reasons.push("Below 21 SMA — avoid"); }
    else { signal = "NEUTRAL"; signalClass = "neutral"; reasons.push("No clear pattern"); }
  }
  if (row.divergence && signalClass === "buy") reasons.push("✓ RSI divergence (bullish)");
  if (vixPrice && vixPrice > 20 && signalClass === "buy") reasons.push("⚠ VIX elevated (" + vixPrice?.toFixed(1) + ")");
  return { signal, signalClass, zone, zoneClass, sma8: sma8.toFixed(0), sma21: sma21.toFixed(0), haBull, reason: reasons.join(" · ") };
}

}

            const symbol = YAHOO[idx.key];
            const [wkRes, dRes] = await Promise.all([
              fetch(CORS + encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1wk&range=2y`), { signal: AbortSignal.timeout(12000) }).catch(() => null),
              fetch(CORS + encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=6mo`), { signal: AbortSignal.timeout(12000) }).catch(() => null),
            ]);
            if (wkRes?.ok) {
              const wJson = await wkRes.json();
              const wC = (wJson?.chart?.result?.[0]?.indicators?.quote?.[0]?.close || []).filter(x => x != null);
              if (wC.length >= 14) {
                const wA = calcRSI(wC, 4), wB = calcRSI(wC, 8), wC2 = calcRSI(wC, 14);
                row.wRsi4 = wA.length ? wA[wA.length-1] : null;
                row.wRsi8 = wB.length ? wB[wB.length-1] : null;
                row.wRsi14 = wC2.length ? wC2[wC2.length-1] : null;
                row.wma20Price = calcWMA(wC, 20);
                row.wma20Rsi = calcWMA(wA, 20);
              }
            }
            if (dRes?.ok && row.dRsi14 == null) {
              const dJson = await dRes.json();
              const dC = (dJson?.chart?.result?.[0]?.indicators?.quote?.[0]?.close || []).filter(x => x != null);
              if (dC.length >= 14) {
                const dA = calcRSI(dC, 4), dB = calcRSI(dC, 8), dC2 = calcRSI(dC, 14);
                row.dRsi4 = dA.length ? dA[dA.length-1] : null;
                row.dRsi8 = dB.length ? dB[dB.length-1] : null;
                row.dRsi14 = dC2.length ? dC2[dC2.length-1] : null;
                row._dailyCloses = dC.slice(-30);
              }
            }
          } catch (e) {}
        }

        row.regime = computeRegime(row['wRsi'+basePeriod], row.price, row.wma20Price);
        const ac = computeAction(row.regime, row['dRsi'+basePeriod]);
        row.action = ac.action; row.rec = ac.rec;
        tempResults[idx.key] = row;
        setResults({ ...tempResults });
        done = i + 1;
      }

      const remaining = indexList.filter(idx => !tempResults[idx.key]);
      remaining.forEach(idx => { tempResults[idx.key] = { name: idx.name, ...priceMap[idx.key] }; });
    }

    setResults({ ...tempResults });

    // BA Phase: Gemini breadth analysis for Regime A + Watchlist indices
    const sk1 = (localStorage.getItem('ld_scanner_gemini_key1') || '').trim();
    const sk2 = (localStorage.getItem('ld_scanner_gemini_key2') || '').trim();
    if ((sk1.length >= 20 || sk2.length >= 20) && !stopRef.current) {
      baStopRef.current = false;
      const baTargets = indexList.filter(idx => {
        const d = tempResults[idx.key];
        return d && !d.error && (d.regime === 'A' || watchlist.includes(idx.name));
      });
      const initBA = {};
      baTargets.forEach(idx => { initBA[idx.name] = { status: 'loading', pct: null }; });
      setBaResults(prev => ({ ...prev, ...initBA }));

      let baIdx = 0;
      for (const idx of baTargets) {
        if (stopRef.current || baStopRef.current) break;
        const tr = tempResults[idx.key];
        const result = await callGeminiBA(idx.name, tr?.['wRsi'+basePeriod], basePeriod);
        const pct = result?.regime_a_weight_pct ?? null;
        setBaResults(prev => ({
          ...prev,
          [idx.name]: {
            status: pct !== null ? 'done' : 'error',
            pct,
            bull: result?.bull_count ?? null,
            total: result?.total_count ?? null,
            conf: result?.confidence ?? '',
            note: result?.note ?? ''
          }
        }));
        baIdx++;
        setProgress({ done: 0, total: 0, label: `BA ${baIdx}/${baTargets.length}: ${idx.name}` });
        if (baIdx < baTargets.length) await new Promise(r => setTimeout(r, 4200));
      }
    }

    setProgress({ done: 0, total: 0, label: "" });
    setLastUpdated(new Date());
    setPhase('done');
  };

  // Auto-refresh
  useEffect(() => {
    if (autoRefresh && phase === 'done') {
      autoRef.current = setTimeout(() => { handleScan(); }, 60000);
      return () => clearTimeout(autoRef.current);
    }
  }, [autoRefresh, phase]);

  useEffect(() => {
    const tw = tableWrapRef.current;
    const ts = topScrollRef.current;
    if (!tw || !ts) return;
    const inner = ts.firstElementChild;
    if (inner) inner.style.width = Math.max(tw.scrollWidth, ts.clientWidth + 1) + 'px';
  });

  const sortedRows = useMemo(() => {
    let list = Object.keys(results).map(k => results[k]).filter(r => r.price != null);
    if (searchQuery) {
      list = list.filter(r => r.name === searchQuery);
    }
    if (catFilter !== "ALL") list = list.filter(r => r.key === catFilter);
    if (regimeFilter !== "ALL") list = list.filter(r => r.regime === regimeFilter);
    if (phaseFilter !== "ALL") {
      list = list.filter(r => {
        const et = runExecutionTree(r, vixPrice, basePeriod);
        return et && et.verdict === phaseFilter;
      });
    }
    if (showWatchlist && watchlist.length) {
      list = list.filter(r => watchlist.includes(r.name));
    }
    if (sortConfig.key) {
      list.sort((a, b) => {
        let aVal, bVal;
        if (sortConfig.key === 'priceVsWma') {
          aVal = (a.price && a.wma20Price) ? (a.price > a.wma20Price ? 1 : -1) : 0;
          bVal = (b.price && b.wma20Price) ? (b.price > b.wma20Price ? 1 : -1) : 0;
        } else if (sortConfig.key === 'verdict') {
          const etA = runExecutionTree(a, vixPrice, basePeriod);
          const etB = runExecutionTree(b, vixPrice, basePeriod);
          aVal = etA ? etA.label : '';
          bVal = etB ? etB.label : '';
        } else if (sortConfig.key === 'detail') {
          const etA = runExecutionTree(a, vixPrice, basePeriod);
          const etB = runExecutionTree(b, vixPrice, basePeriod);
          aVal = etA ? etA.detail : '';
          bVal = etB ? etB.detail : '';
        } else if (sortConfig.key === 'baPct') {
          aVal = baResults[a.name]?.pct ?? -1;
          bVal = baResults[b.name]?.pct ?? -1;
        } else if (sortConfig.key === 'haSignal') {
          const sigOrder = {'STRONG SELL':1,'SELL':2,'CAUTION':3,'WATCH':4,'NEUTRAL':5,'HOLD':6,'BUY':7};
          const haA = computeHABandSignal(a, vixPrice);
          const haB = computeHABandSignal(b, vixPrice);
          aVal = sigOrder[haA?.signal] ?? 5;
          bVal = sigOrder[haB?.signal] ?? 5;
        } else if (sortConfig.key === 'dRsi14') {
          aVal = a.dRsi14 ?? -1;
          bVal = b.dRsi14 ?? -1;
        } else if (sortConfig.key === 'wRsi14') {
          aVal = a.wRsi14 ?? -1;
          bVal = b.wRsi14 ?? -1;
        } else {
          aVal = a[sortConfig.key];
          bVal = b[sortConfig.key];
        }
        if (aVal == null) return 1;
        if (bVal == null) return -1;
        if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
        if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
        return 0;
      });
      return list;
    }
    return list.sort((a, b) => {
      const ord = { A: 1, B: 2, C: 3 };
      const ra = ord[a.regime] || 4, rb = ord[b.regime] || 4;
      if (ra !== rb) return ra - rb;
      return (b.wRsi ?? -Infinity) - (a.wRsi ?? -Infinity);
    });
  }, [results, searchQuery, regimeFilter, phaseFilter, catFilter, vixPrice, sortConfig, baResults, showWatchlist, watchlist]);

  const hasData = sortedRows.length > 0 && Object.keys(results).length > 0;
  const pct = Math.round((progress.done / (progress.total || 1)) * 100);

  return (
    <div>
      <header className="app-header">
        <div className="brand">
          <div className="brand-icon">LD</div>
          <div className="brand-text">
            <h1>Lie Detector Scanner V3A</h1>
            <p>Bull-Only · NSE Indices · BUY / HOLD / WAIT / SELL</p>
          </div>
        </div>
        <div className="header-right">
          {lastUpdated && <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text-faint)'}}>{lastUpdated.toLocaleTimeString('en-IN')}</span>}
          {hasData && <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text-dim)'}}>{sortedRows.length} shown</span>}
          <span className={`live-dot ${phase==='rsi'||phase==='prices'?'active':''}`}>
            {phase==='rsi'||phase==='prices' ? 'SCANNING…' : phase==='done' ? (dataSource||'READY') : 'INIT'}
          </span>
        </div>
      </header>

      <div className="main-wrap">

        {error && <div className="err-bar">{error}</div>}

        {/* ── SUMMARY TILES ── */}
        {hasData && (() => {
          const all = Object.values(results).filter(r => r.price != null);
          const counts = { BUY:0, HOLD:0, WAIT:0, SELL:0 };
          all.forEach(r => {
            const et = runExecutionTree(r, vixPrice, basePeriod);
            let d = 'WAIT';
            if (!et) { d = 'WAIT'; }
            else if (et.verdict === 'VERIFIED STRIKE') d = 'BUY';
            else if (et.verdict === 'NEAR MISS') d = 'BUY';
            else if (et.verdict === 'NOT READY' && r.regime === 'A') d = 'HOLD';
            else if (et.verdict === 'FAKE SUPPORT' || et.verdict === 'ABORT') d = 'SELL';
            else d = 'WAIT';
            counts[d] = (counts[d]||0) + 1;
          });
          const aCnt = all.filter(r=>r.regime==='A').length;
          const activeVerdict = phaseFilter;
          return (
            <div className="summary-row">
              <div className={`s-tile ${activeVerdict==='VERIFIED STRIKE'||activeVerdict==='NEAR MISS'?'active-buy':''}`}
                onClick={()=>setPhaseFilter(v=>v==='VERIFIED STRIKE'?'ALL':'VERIFIED STRIKE')}>
                <div className="s-tile-lbl">⚡ BUY</div>
                <div className="s-tile-num g">{counts.BUY}</div>
                <div className="s-tile-sub">Strike + Near Miss</div>
              </div>
              <div className={`s-tile ${activeVerdict==='HOLD'?'active-hold':''}`}
                onClick={()=>setPhaseFilter(v=>v==='HOLD'?'ALL':'HOLD')}>
                <div className="s-tile-lbl">⏸ HOLD</div>
                <div className="s-tile-num y">{counts.HOLD}</div>
                <div className="s-tile-sub">Regime A · Trend on</div>
              </div>
              <div className={`s-tile ${activeVerdict==='NOT READY'?'active-miss':''}`}
                onClick={()=>setPhaseFilter(v=>v==='NOT READY'?'ALL':'NOT READY')}>
                <div className="s-tile-lbl">⌛ WAIT</div>
                <div className="s-tile-num b">{counts.WAIT}</div>
                <div className="s-tile-sub">Not in zone yet</div>
              </div>
              <div className={`s-tile ${activeVerdict==='ABORT'||activeVerdict==='FAKE SUPPORT'?'active-sell':''}`}
                onClick={()=>setPhaseFilter(v=>v==='ABORT'?'ALL':'ABORT')}>
                <div className="s-tile-lbl">✗ SELL/AVOID</div>
                <div className="s-tile-num r">{counts.SELL}</div>
                <div className="s-tile-sub">Regime B/C · Trust break</div>
              </div>
              <div className="s-tile">
                <div className="s-tile-lbl">🟢 Regime A</div>
                <div className="s-tile-num g">{aCnt}</div>
                <div className="s-tile-sub">of {all.length} total</div>
              </div>
            </div>
          );
        })()}

        {/* ── VIX ── */}
        {vixPrice != null && (
          <div className={`vix-bar ${vixPrice>20?'danger':vixPrice<15?'ok':''}`}>
            <span style={{fontFamily:'var(--mono)',fontSize:9,letterSpacing:'1.5px',textTransform:'uppercase',color:'var(--text-faint)'}}>India VIX</span>
            <span className={`vix-num ${vixPrice>20?'danger':vixPrice<15?'ok':'warn'}`}>{vixPrice.toFixed(1)}</span>
            {vixOpen!=null && <span style={{color:'var(--text-dim)',fontSize:10}}>{(vixPrice-vixOpen)>0?'▲':'▼'} {Math.abs(vixPrice-vixOpen).toFixed(2)}</span>}
            <span style={{marginLeft:'auto',fontFamily:'var(--mono)',fontSize:10,color:vixPrice>20?'var(--red)':vixPrice<15?'var(--green)':'var(--amber)'}}>
              {vixPrice>20?'⚠ ELEVATED — Size 50% only':vixPrice<15?'✓ Low — Full size OK':'Moderate — Normal size'}
            </span>
          </div>
        )}

        {/* ── GEMINI KEY BAR ── */}
        <div className={`ba-key-bar ${geminiKey1||geminiKey2?'has-key':''}`}>
          <span className="ba-key-label">Gemini BA</span>
          <span className="ba-key-status" style={{color:geminiKey1||geminiKey2?'var(--green)':'var(--amber)'}}>
            {geminiKey1||geminiKey2 ? '✓ Active' : '⚠ No keys'}
            {keyStatus && <span style={{marginLeft:8,color:'var(--green)'}}>{keyStatus}</span>}
          </span>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',flex:1,alignItems:'center',minWidth:180}}>
            <input className="ba-key-input" type="password" placeholder="Key 1: AIza…"
              value={keyInput1} onChange={e=>setKeyInput1(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveGeminiKey1()}/>
            <button className={`ba-key-save ${geminiKey1?'saved':''}`} onClick={saveGeminiKey1}>{geminiKey1?'Update 1':'Save 1'}</button>
            <input className="ba-key-input" type="password" placeholder="Key 2: AIza…"
              value={keyInput2} onChange={e=>setKeyInput2(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveGeminiKey2()}/>
            <button className={`ba-key-save ${geminiKey2?'saved':''}`} onClick={saveGeminiKey2}>{geminiKey2?'Update 2':'Save 2'}</button>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <span className="ba-key-label">Base RSI</span>
            <select className="ba-period-select" value={basePeriod} onChange={e=>setBasePeriod(Number(e.target.value))}>
              <option value={4}>4</option><option value={8}>8</option><option value={14}>14</option>
            </select>
          </div>
        </div>

        {/* ── CONTROLS ── */}
        <div className="controls-bar">
          <div className="controls-left">
            <div className="filter-group">
              <span className="filter-label">Index</span>
              <select className="filter-select" value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} style={{minWidth:110}}>
                {indexNames.map(n=><option key={n} value={n==='ALL'?'':n}>{n}</option>)}
              </select>
            </div>
            <div className="filter-group">
              <span className="filter-label">Category</span>
              <select className="filter-select" value={catFilter} onChange={e=>setCatFilter(e.target.value)} style={{minWidth:70}}>
                {categories.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="filter-group">
              <span className="filter-label">Regime</span>
              <select className="filter-select" value={regimeFilter} onChange={e=>setRegimeFilter(e.target.value)}>
                <option value="ALL">All</option>
                <option value="A">A — Bull</option>
                <option value="B">B — Fatigue</option>
                <option value="C">C — Break</option>
              </select>
            </div>
            <div className="filter-group">
              <span className="filter-label">Decision</span>
              <select className="filter-select" value={phaseFilter} onChange={e=>setPhaseFilter(e.target.value)}>
                <option value="ALL">All</option>
                <option value="VERIFIED STRIKE">⚡ BUY — Strike</option>
                <option value="NEAR MISS">⚡ BUY — Near Miss</option>
                <option value="NOT READY">⌛ Wait</option>
                <option value="FAKE SUPPORT">✗ Fake Support</option>
                <option value="ABORT">✗ Abort</option>
              </select>
            </div>
            <button className={`btn-wl ${showWatchlist?'active':''}`} onClick={()=>setShowWatchlist(v=>!v)}>
              {showWatchlist?'★ Watch':'☆ Watch'}
            </button>
          </div>
          {phase!=='rsi'&&phase!=='prices'
            ? <button className="btn-scan" onClick={handleScan}>⚡ SCAN NOW</button>
            : <button className="btn-stop" onClick={()=>{stopRef.current=true;baStopRef.current=true;}}>■ Stop ({pct}%)</button>
          }
        </div>

        {(phase==='rsi'||phase==='prices') && (
          <div className="progress-wrap">
            <div className="progress-top">
              <span className="progress-label">{progress.label} ({progress.done}/{progress.total})</span>
              {phase==='rsi'&&<span className="progress-pct">{pct}%</span>}
            </div>
            {phase==='rsi'&&<div className="progress-track"><div className="progress-fill" style={{width:pct+'%'}}/></div>}
          </div>
        )}

        {hasData ? (
          <div>
            <div ref={topScrollRef} className="table-top-scroll" style={{overflowX:'auto',overflowY:'hidden',height:10,background:'var(--bg2)',border:'1px solid var(--border2)',borderBottom:'none'}}
              onScroll={e=>{if(tableWrapRef.current)tableWrapRef.current.scrollLeft=e.target.scrollLeft;}}>
              <div ref={el=>{if(el&&tableWrapRef.current)el.style.width=tableWrapRef.current.scrollWidth+'px'}} style={{height:1}}/>
            </div>
            <div className="table-wrap" ref={tableWrapRef} onScroll={e=>{if(topScrollRef.current)topScrollRef.current.scrollLeft=e.target.scrollLeft;}}>
            <table>
              <thead>
                <tr>
                  <th style={{width:34,textAlign:'center'}}>#</th>
                  <th onClick={()=>requestSort('name')}>Index{getSortIcon('name')}</th>
                  <th onClick={()=>requestSort('price')}>Price{getSortIcon('price')}</th>
                  <th style={{textAlign:'center'}} onClick={()=>requestSort('changePct')}>%Chg{getSortIcon('changePct')}</th>
                  <th style={{textAlign:'center'}} onClick={()=>requestSort('regime')}>Regime{getSortIcon('regime')}</th>
                  <th style={{textAlign:'center'}} onClick={()=>requestSort('wRsi14')}>W-RSI 4·8·14{getSortIcon('wRsi14')}</th>
                  <th style={{textAlign:'center'}} onClick={()=>requestSort('dRsi14')}>D-RSI 4·8·14{getSortIcon('dRsi14')}</th>
                  <th style={{textAlign:'center',borderLeft:'2px solid var(--green)',minWidth:110}} onClick={()=>requestSort('verdict')}>DECISION{getSortIcon('verdict')}</th>
                  <th style={{minWidth:160}}>Reason</th>
                  <th style={{textAlign:'center',minWidth:86}} onClick={()=>requestSort('baPct')}>Breadth{getSortIcon('baPct')}</th>
                  <th className="ha-sep" style={{textAlign:'center',minWidth:80}} onClick={()=>requestSort('haSignal')}>Validation{getSortIcon('haSignal')}</th>
                </tr>
              </thead>
              <tbody>
                {sortedRows.map((r,i) => {
                  const et = runExecutionTree(r, vixPrice, basePeriod);
                  const ha = computeHABandSignal(r, vixPrice);
                  const haCls = ha ? (ha.signalClass==='buy'?'ha-signal-buy':ha.signalClass==='sell'?'ha-signal-sell':ha.signalClass==='watch'?'ha-signal-watch':'ha-signal-neutral') : 'ha-signal-neutral';

                  // ── Master Decision ──
                  let decVerdict, decCls, decReason;
                  if (!et) {
                    decVerdict='WAIT'; decCls='WAIT'; decReason='Insufficient RSI data';
                  } else if (et.verdict==='VERIFIED STRIKE') {
                    decVerdict='BUY'; decCls='BUY'; decReason='Strike · All 3 D-RSI in zone';
                  } else if (et.verdict==='NEAR MISS') {
                    decVerdict='BUY'; decCls='BUY'; decReason='Near Miss · ' + et.detail;
                  } else if (et.verdict==='FAKE SUPPORT') {
                    decVerdict='SELL'; decCls='SELL'; decReason='Fake Support · ' + (et.detail||'').split('|')[0].trim();
                  } else if (et.verdict==='ABORT') {
                    decVerdict='SELL'; decCls='SELL'; decReason='Abort · ' + et.detail;
                  } else if (et.verdict==='NOT READY' && r.regime==='A') {
                    decVerdict='HOLD'; decCls='HOLD'; decReason='Regime A · D-RSI not in zone yet';
                  } else {
                    decVerdict='WAIT'; decCls='WAIT'; decReason=et.detail||'Stand aside';
                  }

                  return (
                    <tr key={i}>
                      <td style={{textAlign:'center',padding:0}}>
                        <button onClick={()=>toggleWatchlist(r.name)} style={{display:'inline-block',width:'100%',height:'100%',padding:'9px 6px',background:watchlist.includes(r.name)?'var(--amber)':'transparent',color:watchlist.includes(r.name)?'#000':'var(--text-faint)',border:'none',cursor:'pointer',fontFamily:'var(--mono)',fontSize:11,fontWeight:watchlist.includes(r.name)?700:400,lineHeight:1}}>{i+1}</button>
                      </td>
                      <td className="name-col">{r.name}</td>
                      <td style={{fontWeight:600}}>{r.price?.toFixed(2)??'—'}</td>
                      <td style={{textAlign:'center',fontWeight:600,color:r.changePct>0?'var(--green)':r.changePct<0?'var(--red)':'var(--text-dim)'}}>
                        {r.changePct==null?'—':`${r.changePct>0?'▲':r.changePct<0?'▼':''}${Math.abs(r.changePct).toFixed(2)}%`}
                      </td>
                      <td style={{textAlign:'center'}}><span className={`pill pill-${r.regime||'?'}`}>{r.regime||'—'}</span></td>
                      <td style={{textAlign:'center'}}>
                        <div style={{display:'flex',gap:3,justifyContent:'center'}}>
                          <span className={`conf-pill ${r.wRsi4==null?'':r.wRsi4>=50?'rsi-green':r.wRsi4>=40?'rsi-amber':'rsi-red'}`}>{r.wRsi4?.toFixed(0)??'—'}</span>
                          <span className={`conf-pill ${r.wRsi8==null?'':r.wRsi8>=50?'rsi-green':r.wRsi8>=40?'rsi-amber':'rsi-red'}`}>{r.wRsi8?.toFixed(0)??'—'}</span>
                          <span className={`conf-pill ${r.wRsi14==null?'':r.wRsi14>=50?'rsi-green':r.wRsi14>=40?'rsi-amber':'rsi-red'}`}>{r.wRsi14?.toFixed(0)??'—'}</span>
                        </div>
                      </td>
                      <td style={{textAlign:'center'}}>
                        <div style={{display:'flex',gap:3,justifyContent:'center'}}>
                          <span className={`conf-pill ${r.dRsi4==null?'':r.dRsi4>=40&&r.dRsi4<=50?'rsi-green':r.dRsi4>50?'rsi-amber':'rsi-red'}`}>{r.dRsi4?.toFixed(0)??'—'}</span>
                          <span className={`conf-pill ${r.dRsi8==null?'':r.dRsi8>=40&&r.dRsi8<=50?'rsi-green':r.dRsi8>50?'rsi-amber':'rsi-red'}`}>{r.dRsi8?.toFixed(0)??'—'}</span>
                          <span className={`conf-pill ${r.dRsi14==null?'':r.dRsi14>=40&&r.dRsi14<=50?'rsi-green':r.dRsi14>50?'rsi-amber':'rsi-red'}`}>{r.dRsi14?.toFixed(0)??'—'}</span>
                        </div>
                      </td>
                      <td style={{textAlign:'center',borderLeft:'2px solid var(--green)'}}>
                        <div className="decision-cell">
                          <span className={`dec-badge dec-${decCls}`}>{decVerdict}</span>
                        </div>
                      </td>
                      <td style={{fontSize:10,color:'var(--text-dim)',maxWidth:180,whiteSpace:'normal',lineHeight:1.4}}>{decReason}</td>
                      <td style={{textAlign:'center'}}>
                        {(() => {
                          if (r.regime!=='A'&&!watchlist.includes(r.name)) return <span className="ba-pill ba-na">—</span>;
                          const ba = baResults[r.name];
                          if (!ba) { const hk1=(localStorage.getItem('ld_scanner_gemini_key1')||'').trim(); const hk2=(localStorage.getItem('ld_scanner_gemini_key2')||'').trim(); return <span className="ba-pill ba-na" style={{fontSize:9}}>{hk1.length>=20||hk2.length>=20?'Scan':'No key'}</span>; }
                          if (ba.status==='loading') return <span className="ba-loading"/>;
                          if (ba.status==='error'||ba.pct===null) return <span className="ba-pill ba-na">Err</span>;
                          const p=ba.pct; const cls=p>=60?'ba-strong':p>=40?'ba-moderate':'ba-weak'; const cb=ba.conf==='HIGH'?'●':ba.conf==='MEDIUM'?'◑':'○';
                          return <span className={`ba-pill ${cls}`} title={`${p}% Regime A | ${ba.bull??'?'}/${ba.total??'?'} | ${ba.conf} | ${ba.note||''}`}>{p}% {cb}</span>;
                        })()}
                      </td>
                      <td className="ha-sep" style={{textAlign:'center'}}>
                        {ha ? <span className={`ha-pill ${haCls}`} title={ha.reason}>{ha.signal}</span> : <span className="ha-pill ha-signal-neutral">—</span>}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            </div>
          </div>
        ) : phase==='init' && (
          <div className="empty-state">
            <div className="big-icon">📡</div>
            <h2>Ready to Scan</h2>
            <p>Bull-Only Profit Engine<br/>Regime A/B/C · Strike Zone · Breadth Analysis<br/><br/><strong style={{color:'var(--green)'}}>BUY only when all signals align. Sit out the rest.</strong></p>
          </div>
        )}

      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<Scanner />);
</script>

<script>
// ── PWA: Service Worker registration ──────────────────────────────
if ('serviceWorker' in navigator) {
  // Skip SW in sandboxed preview environments (e.g. Claude, CodePen, StackBlitz)
  const _swHost = location.hostname;
  const _swSkip = _swHost.includes('claudeusercontent.com') ||
                  _swHost.includes('codepen.io') ||
                  _swHost.includes('stackblitz.io') ||
                  _swHost === '';
  if (!_swSkip) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        console.log('[LD Scanner] SW registered:', reg.scope);
      }).catch(err => console.warn('[LD Scanner] SW failed:', err));
    });
  } else {
    console.log('[LD Scanner] SW skipped — preview environment detected (' + _swHost + ')');
  }
}

// ── PWA: Install prompt (deferred) ────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

function showInstallBanner() {
  if (document.getElementById('pwa-install-bar')) return;
  const bar = document.createElement('div');
  bar.id = 'pwa-install-bar';
  bar.style.cssText = `
    position:fixed;bottom:0;left:0;right:0;z-index:9999;
    background:#faf7f0;border-top:2px solid #d4880f;
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 20px;font-family:'IBM Plex Mono',monospace;font-size:12px;
    color:#1a1a1a;gap:12px;
  `;
  bar.innerHTML = `
    <span style="color:#d4880f;font-weight:700;letter-spacing:1px;">⚡ INSTALL APP</span>
    <span style="color:#222222;flex:1">Install Lie Detector Scanner for offline access & home screen icon.</span>
    <button id="pwa-install-btn" style="background:#d4880f;color:#fff;border:none;padding:7px 18px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase;">Install</button>
    <button id="pwa-dismiss-btn" style="background:transparent;color:#222222;border:1px solid #d0c8b8;padding:7px 12px;font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;">✕</button>
  `;
  document.body.appendChild(bar);
  document.getElementById('pwa-install-btn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    bar.remove();
  });
  document.getElementById('pwa-dismiss-btn').addEventListener('click', () => bar.remove());
}

window.addEventListener('appinstalled', () => {
  const bar = document.getElementById('pwa-install-bar');
  if (bar) bar.remove();
  console.log('[LD Scanner] App installed!');
});
</script>
</body>
</html>
